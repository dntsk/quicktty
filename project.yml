name: QuickTTY
options:
  deploymentTarget:
    macOS: "15.0"
  minimumXcodeGenVersion: 2.45.4
settings:
  base:
    ARCHS: arm64
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-incomplete-umbrella"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: "6.0"
targets:
  QuickTTY:
    type: application
    platform: macOS
    sources:
      - path: QuickTTY
        excludes:
          - Resources
      - path: QuickTTY/Resources
        excludes:
          - AgentIntegrations
          - AgentSessionIntegrations
          - Info.plist
        buildPhase: resources
        group: Resources
      - path: QuickTTY/Resources/AgentIntegrations
        type: folder
        buildPhase: resources
        group: Resources
      - path: QuickTTY/Resources/AgentSessionIntegrations
        type: folder
        buildPhase: resources
        group: Resources
      - path: Shared/AgentIntegrations
      - path: Vendor/ghostty/macos/Sources/Features/Splits/SplitView.swift
      - path: Vendor/ghostty/macos/Sources/Features/Splits/SplitView.Divider.swift
      - path: Vendor/ghostty/macos/Sources/Helpers/Backport.swift
    dependencies:
      - target: QuickTTYCLI
        embed: false
        link: false
      - sdk: Carbon.framework
      - framework: Vendor/ghostty/macos/GhosttyKit.xcframework
        embed: false
      - framework: Vendor/sparkle/Sparkle.xcframework
        embed: true
    postBuildScripts:
      - name: Copy QuickTTY CLI Helper
        script: |
          destination="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/quicktty"
          if [ "$ACTION" = install ]; then
            source="$UNINSTALLED_PRODUCTS_DIR/$PLATFORM_NAME/quicktty"
          else
            source="$BUILT_PRODUCTS_DIR/quicktty"
          fi
          "$SRCROOT/scripts/copy-cli-helper.sh" \
            "$source" \
            "$destination"
          if [ "$ACTION" = install ]; then
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp --options runtime --identifier com.dntsk.QuickTTY.cli "$destination"
          fi
        basedOnDependencyAnalysis: false
      - name: Copy Ghostty Runtime Resources
        script: |
          "$SRCROOT/scripts/copy-ghostty-resources.sh" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            "$TARGET_BUILD_DIR/QuickTTY.app/Contents/Resources"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 10
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QuickTTY/Resources/Info.plist
        MARKETING_VERSION: 0.1.3
        OTHER_LDFLAGS: "$(inherited) -lstdc++"
        PRODUCT_BUNDLE_IDENTIFIER: com.dntsk.QuickTTY
        PRODUCT_NAME: QuickTTY
  QuickTTYCLI:
    type: tool
    platform: macOS
    sources:
      - path: Shared/AgentIntegrations
      - path: QuickTTYCLI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dntsk.QuickTTY.cli
        PRODUCT_MODULE_NAME: QuickTTYCLI
        PRODUCT_NAME: quicktty
        SKIP_INSTALL: YES
  QuickTTYTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: QuickTTYTests
        excludes:
          - Fixtures
      - path: QuickTTYTests/Fixtures
        type: folder
        buildPhase: resources
        group: Fixtures
    dependencies:
      - target: QuickTTY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dntsk.QuickTTYTests
        PRODUCT_NAME: QuickTTYTests
schemes:
  QuickTTY:
    build:
      targets:
        QuickTTY: all
        QuickTTYTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuickTTYTests
